[build-system]
requires = ["setuptools>=80", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeoid"
dynamic = ["version"]
description = "Python toolkit for physical geodesy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ilya Oshchepkov" }]
keywords = ["geodesy", "gravimetry", "gravity", "geoid"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Education",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy",
  "scipy",
  "pyproj",
  "astropy",
  "pandas",
  "joblib",
  "pyshtools",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["pytest", "ruff"]
docs = [
  "sphinx>=8",
  "myst-parser",
  "sphinx-rtd-theme>=2",
  "nbsphinx",
  "jupyter",
]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--cov=pygeoid",
  "--cov-report=term-missing",
  "--cov-report=xml",
]
python_files = "test_*.py"

[tool.ruff]
line-length = 88
extend-exclude = ["*test*"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
branch = true
source = ["pygeoid"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
